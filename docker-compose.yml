services:
  shinobi:
    build: .
    container_name: shinobi
    restart: unless-stopped
    ports:
      - "8060:8060"
    environment:
      - PORT=8060
      - SHINOBI_DB_PATH=/data/shinobi.db
      - DATA_DIR=/data/downloads
      - EXTRACTOR_URL=http://extractor:9090
      - RUST_LOG=shinobi=info,tower_http=info
    volumes:
      - shinobi-data:/data
    depends_on:
      extractor:
        condition: service_started

  extractor:
    build: ./extractor
    container_name: shinobi-extractor
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - DATA_DIR=/data/downloads
    volumes:
      - shinobi-data:/data

volumes:
  # Single shared volume: SQLite database (/data/shinobi.db) and scraped
  # artifacts (/data/downloads) survive container recreation and are shared
  # between the Rust backend and the Python extractor.
  shinobi-data:

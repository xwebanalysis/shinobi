<nav class="topbar">
  <div class="brand">
    <h1 class="t-heading">SHINOBI</h1>
    <span class="t-label">XWA - SILENT WEB SCRAPER</span>
  </div>

  <div class="topbar-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="t-label nav-link">
      [ DASHBOARD ]
    </a>
    <a routerLink="/history" routerLinkActive="active" class="t-label nav-link">
      [ HISTORY ]
    </a>
    <a routerLink="/schedules" routerLinkActive="active" class="t-label nav-link">
      [ SCHEDULES ]
    </a>
    <a routerLink="/files" routerLinkActive="active" class="t-label nav-link">
      [ FILES ]
    </a>
  </div>

  <div class="topbar-actions">
    <span class="t-label health" [title]="rustTitle()">
      RUST
      <span class="dot" [class]="rustClass()"></span>
    </span>
    <span class="t-label health" [title]="extractorTitle()">
      PYTHON
      <span class="dot" [class]="extractor()"></span>
    </span>
    <button type="button" class="theme-toggle-btn" (click)="toggleTheme()">
      {{ themeLabel() }}
    </button>
  </div>
</nav>

<main class="container dot-grid-subtle">
  <router-outlet />
</main>

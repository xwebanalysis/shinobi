[package]
name = "shinobi"
version = "0.1.0"
edition = "2021"
description = "Web scraper with anti-blocking system and web interface"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }
reqwest = { version = "0.13", features = ["socks", "cookies", "gzip", "brotli", "json"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
futures = "0.3"
tokio-stream = "0.1"
dashmap = "6"
mime_guess = "2"
chromiumoxide = { version = "0.9", default-features = false }
regex = "1"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
base64 = "0.22"
flate2 = "1.1"
zip = "8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
